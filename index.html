<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Go Individual"><title>Go Individual</title><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css?v=1"></head><body>
<main class="app"><header class="topbar"><div><h1>Go <span class="muted">Individual</span></h1><p>Control personal de envíos y ganancias</p></div><button id="theme" class="outline" title="Cambiar tema">☀ Claro</button></header>
<section id="mine"><div class="section-title"><h2>Mis ganancias</h2><button class="primary" id="add-mine">+ Agregar envío</button></div><div id="mine-stats" class="summary"></div><div class="toolbar"><label>Consultar día <input id="mine-date" type="date"></label><button id="mine-today" class="outline">Hoy</button></div><h3>Pedidos del día</h3><div id="mine-orders" class="entries"></div></section>
<footer><div class="footer-buttons"><button id="export" class="outline">Exportar respaldo</button><button id="import" class="outline">Importar respaldo</button><input id="import-file" type="file" accept=".json,application/json" hidden></div><p>Los datos se guardan en este dispositivo. Haz respaldos regularmente.</p></footer>
</main>
<dialog id="order-dialog"><form id="order-form"><h2 id="order-heading">Nuevo envío</h2><label>Negocio (opcional)<input id="order-business" type="text" maxlength="100" placeholder="Ej. Taconazo"></label><label>Ganancia del envío ($)<input id="order-amount" type="number" required min="0" step="0.01" inputmode="decimal" placeholder="35"></label><label>Propina ($) · opcional<input id="order-tip" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></label><label>Pedidos en el viaje<input id="order-count" type="number" min="1" max="100" step="1" inputmode="numeric" value="1" required></label><label>Fecha<input id="order-date" type="date" required></label><p id="order-preview" class="preview"></p><div class="modal-actions"><button type="button" class="outline" data-close>Cancelar</button><button type="submit" class="primary">Guardar envío</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><script src="app.js?v=20261019-12h1"></script></body></html>
